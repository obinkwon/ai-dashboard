<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Model Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div>
        <h1>🤗 AI Model Dashboard</h1>
        <p>Hugging Face에서 인기 있는 AI 모델을 한눈에 확인하세요.</p>
    </div>

    <a
        href="https://huggingface.co/"
        target="_blank"
        class="hf-link">
        Hugging Face ↗
    </a>

</header>


<main class="container">

    <section class="search-area">

        <input
            type="text"
            id="searchInput"
            placeholder="모델 검색 (예: llama, qwen, gemma)"
        >

        <button id="searchButton">
            검색
        </button>

    </section>


    <section class="category-area">

        <button class="category active" data-filter="all">
            전체
        </button>

        <button class="category" data-filter="text-generation">
            Text Generation
        </button>

        <button class="category" data-filter="text-to-image">
            Image
        </button>

        <button class="category" data-filter="audio">
            Audio
        </button>

    </section>


    <section>

        <div class="section-title">

            <h2 id="sectionTitle">
                🔥 인기 모델
            </h2>

            <button id="refreshButton">
                ↻ 새로고침
            </button>

        </div>


        <div id="loading" class="loading">
            모델 정보를 가져오는 중...
        </div>


        <div id="error" class="error hidden">
        </div>


        <div id="modelList" class="model-list">
        </div>

    </section>

</main>


<footer>

    <p>
        Data provided by
        <a
            href="https://huggingface.co/"
            target="_blank">
            Hugging Face
        </a>
    </p>

</footer>


<script src="app.js"></script>

</body>
</html>
