name: Update Maven Central Packages

on:
  schedule:
    # 매일 한국 시간 오전 9시 전후에 실행
    # GitHub Actions의 cron은 UTC 기준
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-maven:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Maven Central data
        env:
          MAVEN_API: "https://search.maven.org/solrsearch/select"
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          packages = [
              {
                  "key": "spring-boot",
                  "group": "org.springframework.boot",
                  "artifact": "spring-boot",
                  "description": "Spring Boot"
              },
              {
                  "key": "spring-core",
                  "group": "org.springframework",
                  "artifact": "spring-core",
                  "description": "Spring Framework Core"
              },
              {
                  "key": "jackson-databind",
                  "group": "com.fasterxml.jackson.core",
                  "artifact": "jackson-databind",
                  "description": "Jackson data-binding"
              },
              {
                  "key": "junit",
                  "group": "org.junit.jupiter",
                  "artifact": "junit-jupiter",
                  "description": "JUnit Jupiter"
              },
              {
                  "key": "lombok",
                  "group": "org.projectlombok",
                  "artifact": "lombok",
                  "description": "Java annotation processor"
              }
          ]

          results = []

          for package in packages:
              group = package["group"]
              artifact = package["artifact"]

              query = f'g:"{group}" AND a:"{artifact}"'

              params = urllib.parse.urlencode({
                  "q": query,
                  "rows": 1,
                  "wt": "json"
              })

              url = f"https://search.maven.org/solrsearch/select?{params}"

              print(f"Fetching: {group}:{artifact}")

              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "developer-hub-github-actions"
                      }
                  )

                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.loads(response.read().decode("utf-8"))

                  docs = data.get("response", {}).get("docs", [])

                  if docs:
                      doc = docs[0]

                      version = (
                          doc.get("latestVersion")
                          or doc.get("v")
                          or "-"
                      )

                      results.append({
                          "key": package["key"],
                          "name": f"{group}:{artifact}",
                          "version": version,
                          "description": package["description"],
                          "url": (
                              f"https://central.sonatype.com/artifact/"
                              f"{group}/{artifact}"
                          )
                      })

                      print(f"  -> {version}")

                  else:
                      print("  -> No result")

                      results.append({
                          "key": package["key"],
                          "name": f"{group}:{artifact}",
                          "version": "-",
                          "description": package["description"],
                          "url": (
                              f"https://central.sonatype.com/artifact/"
                              f"{group}/{artifact}"
                          )
                      })

              except Exception as e:
                  print(f"  -> ERROR: {e}")

                  results.append({
                      "key": package["key"],
                      "name": f"{group}:{artifact}",
                      "version": "-",
                      "description": package["description"],
                      "url": (
                          f"https://central.sonatype.com/artifact/"
                          f"{group}/{artifact}"
                      )
                  })

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "packages": results
          }

          with open("data/maven.json", "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("maven.json updated.")
          PY

      - name: Commit updated Maven data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/maven.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update Maven Central packages"
            git push
          fi
